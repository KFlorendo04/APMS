[project]
name = "apms-ai-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.7,<3", "shap>=0.48,<1"]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
